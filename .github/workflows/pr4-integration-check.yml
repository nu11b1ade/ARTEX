name: verify-v0.3.30-integration
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.action != 'closed' && github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex_pr4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex -d artex_pr4"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-ci-test@127.0.0.1:5432/artex_pr4?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format review
        run: gofmt -d netprofile/browser.go netprofile/browser_test.go internal/webfetch/network_profile_test.go
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Network regressions with race detector
        run: go test -race ./internal/httpidentity ./netprofile ./internal/webfetch ./enrich ./selfupdate ./traffic -count=1 -timeout 180s
      - name: Command interception regressions
        run: go test -race ./intercept -run '^TestMatchTool' -count=1 -timeout 180s
      - name: Agent WebFetch registration
        run: go test -race ./agent -run '^TestAgentSessionUsesConfiguredWebFetch$' -count=1 -timeout 180s
      - name: MCP and HTTP integration against PostgreSQL
        run: go test -race ./server -run 'TestMCPServer|TestNormalizeMCPAccessConfig|TestNormalizeAPITokenInput|TestProbe|TestEgressProbe|TestRepeater|TestRunHTTPTool|TestHTTPTool|TestTargetHTTPIdentity' -count=1 -timeout 300s -v

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the existing release pipeline after the reviewed PR is merged
        run: gh workflow run release.yml --ref main -f tag=v0.3.30 -F create_tag=true
