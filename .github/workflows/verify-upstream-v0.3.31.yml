name: verify-upstream-v0.3.31

on:
  push:
    branches: [sync/upstream-v0.3.31]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            ref: ad8b8f6ffbabc39046043d32665a0911c77607aa
          - name: scoped
            ref: 612d96dd7fec9d8de2191afce7d68c0bb29ab7d6
    name: backend-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare existing baseline failures
        if: matrix.name == 'baseline'
        run: |
          set +e
          go test -race -count=1 -p 1 -json ./agent ./db ./server > /tmp/artex-baseline.jsonl
          status=$?
          set -e
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/artex-baseline.jsonl').read_text().splitlines():
              try: rows.append(json.loads(line))
              except ValueError: pass
          failed={r['Test'] for r in rows if r.get('Action')=='fail' and 'Test' in r and '/' not in r['Test']}
          expected={'TestGraphOverviewExpandsAssociatedCompanyScope','TestCaptureApprovalLifecycle','TestInterceptApprovalFilters','TestSideTaskArchiveVersions'}
          print('Baseline failed tests:', sorted(failed))
          print('Baseline data race:', any('WARNING: DATA RACE' in r.get('Output','') for r in rows))
          for r in rows:
              if r.get('Action')=='fail' or 'race detected' in r.get('Output',''):
                  print(json.dumps(r,ensure_ascii=False))
          if not expected.issubset(failed):
              raise SystemExit('Expected baseline failure comparison is incomplete; inspect logs')
          CHECK
          printf 'Baseline go test exit code: %s\n' "$status"
      - name: Run changed feature regressions in isolated processes and databases
        if: matrix.name == 'scoped'
        env:
          PGPASSWORD: artex-ci-test
        run: |
          set -euo pipefail
          for package in agent db server; do
            case "$package" in
              agent) pattern='^Test(ConfigFromGemini|FromEnvGemini|Gemini|SanitizeGemini|RequestLimiter|RateLimited|ProxyEnv)' ;;
              db) pattern='^Test(DeleteFindings|TaskPatchWorkerCount)' ;;
              server) pattern='^Test(Backup|ApplyPendingRestore|WorkerHotResize|WorkerPoolProfileHotReload|WorkerPoolSettingsRoundTrip|WorkerSettingsDirectSetters|Pinned|DetachedIntent|ExpandWorkerSlots|ValidateWorkerPools|Repeater|GeminiModelList|DeleteFindings|TaskMetadata|UpdateTaskMetadata|EgressProbe|MCPServer)' ;;
            esac
            go test -list "$pattern" "./$package" | sed -n '/^Test/p' > /tmp/artex-tests
            test -s /tmp/artex-tests
            index=0
            while IFS= read -r test_name; do
              index=$((index + 1))
              database="ci_${package}_${index}"
              createdb -h 127.0.0.1 -U artex "$database"
              ARTEX_PG_DSN="postgres://artex:artex-ci-test@127.0.0.1:5432/$database?sslmode=disable" \
                go test -race -count=1 -v -run "^${test_name}$" "./$package"
              dropdb -h 127.0.0.1 -U artex --force "$database"
            done < /tmp/artex-tests
          done
          go test -race -count=1 -p 1 ./traffic ./netprofile ./internal/httpidentity ./internal/webfetch
      - name: Check HTTP collector templates
        if: matrix.name == 'scoped'
        run: python3 -m unittest discover -s skills/api-recon/scripts -p test_user_agent.py
      - name: Validate deployment scripts
        if: matrix.name == 'scoped'
        run: bash -n deploy.sh install.sh update.sh
      - name: Validate Nginx backup route
        if: matrix.name == 'scoped'
        run: |
          mkdir -p /tmp/artex-nginx
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout /tmp/artex-nginx/privkey.pem -out /tmp/artex-nginx/fullchain.pem
          sed 's/__ARTEX_DOMAIN__/localhost/g' deploy/nginx/site.conf.template > /tmp/artex-nginx/site.conf
          docker run --rm -v /tmp/artex-nginx/site.conf:/etc/nginx/conf.d/default.conf:ro -v /tmp/artex-nginx:/etc/nginx/certs:ro nginx:stable-alpine nginx -t
