# ARTEX 生产部署：Docker Host 网络 + Nginx HTTPS 统一入口。
#
# 由根目录 ./deploy.sh 使用，与根目录 docker-compose.yml（Bridge 部署）互斥：
# 两者会争用 8787/8788/80/443，切换前先停掉另一套。
#
# Host 网络的作用：
#   - 容器内的 Agent 可以自主监听动态端口（反弹 shell、临时 HTTP 服务、监听器等），
#     不需要事先在 Compose 里声明 ports；
#   - ARTEX Web/API、流量录制代理和 PostgreSQL 都显式绑定到 127.0.0.1，
#     公网只能通过 Nginx 的 80/443 访问，无法直连这些端口。
name: artex-host

services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    # Host 网络下用 listen_addresses 把 PostgreSQL 限制在回环地址；
    # 端口由 deploy.sh 自动选择一个宿主空闲端口并写入 .env。
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${ARTEX_PG_PORT:-5432}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${ARTEX_PG_PORT:-5432} -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:-nullblade/artex}:${ARTEX_TAG:-latest}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@127.0.0.1:${ARTEX_PG_PORT:-5432}/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # JWT/Basic Auth Cookie 的签名密钥放到独立卷，更新重建容器后登录态不失效。
      ARTEX_JWT_KEY_PATH: /app/state/jwt.key
      # 首次启动种入 HTTP Basic Auth；数据库已有配置时不会覆盖。
      # 用 :? 强制要求存在，避免手工启动一套没有访问验证的生产实例。
      ARTEX_BASIC_AUTH_USER: ${ARTEX_BASIC_AUTH_USER:?请先运行 ./deploy.sh install 生成访问凭据}
      ARTEX_BASIC_AUTH_PASSWORD: ${ARTEX_BASIC_AUTH_PASSWORD:?请先运行 ./deploy.sh install 生成访问凭据}
    # Host 网络下不写 ports；显式绑定回环，只有 Nginx 能访问。
    command: ["-addr", "127.0.0.1:8787", "-proxy", "127.0.0.1:8788"]
    volumes:
      # 与 Bridge 部署共用项目根目录的数据：容器重建、切换部署方式都不丢。
      - ../data:/app/data
      - ../skills:/app/skills
      - state:/app/state
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    network_mode: host
    depends_on:
      artex:
        condition: service_healthy
    volumes:
      # 挂目录而不是单文件：site.conf 被重写后 inode 会变化，单文件 bind mount
      # 会继续指向已删除的旧文件，导致 nginx -s reload 找不到配置。
      - ./nginx:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # ACME HTTP-01 webroot：宿主机 certbot 写入，Nginx 只读提供。
      - ./nginx/webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
    # 默认新建独立数据卷；如需沿用旧部署的卷，在 .env 设置 ARTEX_PG_VOLUME。
    name: ${ARTEX_PG_VOLUME:-artex-host-pgdata}
  state:
    # JWT 签名密钥等运行状态；保留它，更新后无需重新登录。
    name: ${ARTEX_STATE_VOLUME:-artex-host-state}
